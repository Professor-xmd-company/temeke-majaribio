<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duka la Majaribio la Temeke</title>
  <style>
    :root {
      --bg: #FDFBF7;
      --ink: #1C1917;
      --accent: #047857;
      --price: #B91C1C;
    }
    * {
      box-sizing: border-box;
      border-radius: 0 !important;
      box-shadow: none !important;
      text-shadow: none !important;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
    }

    /* Hero Section */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(3rem, 10vw, 8rem) 1rem;
      border-bottom: 2px solid var(--ink);
    }
    .hero-title {
      font-size: clamp(2rem, 5vw + 1rem, 4rem);
      font-weight: 800;
      line-height: 1.1;
      max-width: 20ch;
      margin: 0 0 1rem 0;
    }
    .hero-slogan {
      font-size: clamp(1rem, 1vw + 0.5rem, 1.25rem);
      font-weight: 500;
      color: var(--accent);
      margin: 0;
    }

    /* Fruits Section */
    .fruits {
      padding: clamp(2rem, 5vw, 4rem) 1rem;
      max-width: 1200px;
      margin: 0 auto;
      border-bottom: 2px solid var(--ink);
    }
    .fruits h2 {
      font-size: clamp(1.5rem, 3vw + 1rem, 2.5rem);
      font-weight: 800;
      margin-bottom: 2rem;
      text-align: center;
    }
    .fruit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 0;
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 2px solid var(--ink);
      border-left: 2px solid var(--ink);
    }
    .fruit-card {
      border-right: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .fruit-name {
      font-size: clamp(1rem, 1vw + 0.5rem, 1.25rem);
      font-weight: 600;
      color: var(--ink);
    }
    .fruit-price {
      font-size: clamp(1rem, 1vw + 0.5rem, 1.25rem);
      font-weight: 700;
      color: var(--price);
    }

    /* Contact Section */
    .contact {
      padding: clamp(2rem, 5vw, 4rem) 1rem;
      max-width: 65ch;
      margin: 0 auto;
      text-align: left;
      border-bottom: 2px solid var(--ink);
    }
    .contact h2 {
      font-size: clamp(1.5rem, 3vw + 1rem, 2.5rem);
      font-weight: 800;
      margin-bottom: 1.5rem;
    }
    address {
      font-style: normal;
      color: var(--ink);
      line-height: 1.6;
      font-size: clamp(1rem, 1vw + 0.5rem, 1.25rem);
    }
    address p {
      margin: 0 0 0.5rem 0;
    }
    address p:last-child {
      margin-bottom: 0;
    }

    /* Footer */
    .site-footer {
      background-color: var(--ink);
      color: var(--bg);
      text-align: center;
      padding: 2rem 1rem;
    }
    .site-footer p {
      font-size: 0.875rem;
      margin: 0;
    }
  </style>
</head>
<body>

  <header class="hero">
    <h1 class="hero-title">Duka la Majaribio la Temeke</h1>
    <p class="hero-slogan">Matunda freshi ya Temeke</p>
  </header>

  <main>
    <section class="fruits">
      <h2>Matunda yetu</h2>
      <ul class="fruit-grid">
        <li class="fruit-card">
          <span class="fruit-name">ndizi</span>
          <span class="fruit-price">TSh 1,000</span>
        </li>
        <li class="fruit-card">
          <span class="fruit-name">machungwa</span>
          <span class="fruit-price">TSh 500</span>
        </li>
        <li class="fruit-card">
          <span class="fruit-name">embe</span>
          <span class="fruit-price">TSh 800</span>
        </li>
        <li class="fruit-card">
          <span class="fruit-name">papai</span>
          <span class="fruit-price">TSh 1,500</span>
        </li>
      </ul>
    </section>

    <section class="contact">
      <h2>Mawasiliano</h2>
      <address>
        <p>Simu: +255 700 000 000</p>
        <p>Anwani: Mtaa wa Chang'ombe, Temeke, Dar es Salaam</p>
      </address>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Duka la Majaribio la Temeke</p>
  </footer>

</body>
</html>
